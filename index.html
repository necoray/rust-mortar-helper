<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Mortar Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>MORTAR CALCULATOR</h1>
            <p class="subtitle">Расчёт пристрелки миномёта</p>
        </header>

        <div class="panel" id="analysis-panel">
            <h2>Определение характеристик</h2>
            <div class="form-group">
                <label for="degree">Степень многочлена (m):</label>
                <input type="number" id="degree" value="2" min="1" max="6">
            </div>
            <div id="shots-container" class="shots-grid"></div>
            <div class="form-group">
                <button type="button" id="add-shot-btn">+ Добавить выстрел</button>
            </div>
            <div class="form-group actions">
                <button type="button" id="calculate-btn" class="btn-primary">Рассчитать</button>
                <button type="button" id="export-btn">Экспорт</button>
                <button type="button" id="import-btn">Импорт</button>
                <input type="file" id="import-file" accept=".json" class="file-hidden">
            </div>
            <div id="result-block" class="result hidden">
                <h3>Результат</h3>
                <p id="polynomial-display"></p>
                <div id="scatter-info" class="scatter-block hidden">
                    <h3>Разброс</h3>
                    <div class="scatter-row">
                        <span class="scatter-label">50% попаданий:</span>
                        <span id="scatter-50" class="scatter-value">—</span>
                    </div>
                    <div class="scatter-row">
                        <span class="scatter-label">95% попаданий:</span>
                        <span id="scatter-95" class="scatter-value">—</span>
                    </div>
                    <p class="scatter-note">Интервалы указаны относительно расчётной дистанции</p>
                </div>
                <canvas id="chart" width="700" height="400"></canvas>
                <div class="chart-legend">
                    <span>
                        <div class="dot trajectory"></div> Траектория
                    </span>
                    <span>
                        <div class="dot scatter"></div> Разброс
                    </span>
                    <span>
                        <div class="dot data"></div> Данные
                    </span>
                </div>
            </div>
        </div>

        <div class="panel" id="aiming-panel">
            <h2>Пристрелка</h2>
            <div class="form-group">
                <label for="target-distance">Целевая дистанция (м):</label>
                <input type="number" id="target-distance" placeholder="Например: 250" min="1">
                <button type="button" id="aim-btn" class="btn-primary">Найти угол</button>
            </div>
            <div id="aim-result" class="result hidden">
                <h3>Рекомендуемые углы</h3>
                <ul id="aim-list"></ul>
                <canvas id="mortar-scale" width="700" height="60"></canvas>
            </div>
        </div>

        <!-- <div id="warning-modal" class="modal hidden">
            <div class="modal-content">
                <p>Внимание: несохранённые результаты расчёта будут утеряны.</p>
                <div class="modal-buttons">
                    <button type="button" id="modal-confirm" class="btn-primary">Продолжить</button>
                    <button type="button" id="modal-cancel">Отмена</button>
                </div>
            </div>
        </div> -->
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
